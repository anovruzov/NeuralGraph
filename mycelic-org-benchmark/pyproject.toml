[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mycelic-org-benchmark"
version = "0.1.0"
description = "Adversarial, reproducible benchmark for hierarchical organizational knowledge aggregation (Mycelic) vs centralized alternatives"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=2.0",
  "pyyaml>=6",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "scikit-learn>=1.3"]
real-models = ["requests>=2.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
