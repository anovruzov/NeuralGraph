<svg xmlns="http://www.w3.org/2000/svg" width="760.0" height="400.0" viewBox="0 0 760.0 400.0" font-family="'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif">
<title>Figure 1: the four-node fixture</title>
<rect width="760.0" height="400.0" fill="#ffffff"/>
<text x="28.0" y="34.0" font-size="15.0" text-anchor="start" fill="#1b1b1f" font-weight="600">Three holders of the same premise, two ways to lose it</text>
<text x="28.0" y="54.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">the four-node fixture: a capability needs one 'left' and one 'right', and no node holds both</text>
<rect x="40.0" y="92.0" width="680.0" height="34" rx="4" fill="#f3f6f9" stroke="#d8dade"/>
<text x="380.0" y="114.0" font-size="11.5" text-anchor="middle" fill="#1b1b1f" font-weight="normal">capability  =  left  ⊕  right      (answer held by no single node)</text>
<rect x="40.0" y="156.0" width="132.0" height="96.0" rx="5" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.4"/>
<text x="52.0" y="178.0" font-size="11.5" text-anchor="start" fill="#1b1b1f" font-weight="600">node-a</text>
<text x="52.0" y="198.0" font-size="10.5" text-anchor="start" fill="#1b1b1f" font-weight="normal">slot: left</text>
<text x="52.0" y="216.0" font-size="10.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">lineage root: R1</text>
<text x="52.0" y="232.0" font-size="10.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">failure domain: FD1</text>
<text x="160.0" y="178.0" font-size="10.5" text-anchor="end" fill="#6b7280" font-weight="normal">0.96</text>
<line x1="106.0" y1="156.0" x2="106.0" y2="126.0" stroke="#1f5fa8" stroke-width="1.2" opacity="0.6"/>
<rect x="198.0" y="156.0" width="132.0" height="96.0" rx="5" fill="#ffffff" stroke="#b3441c" stroke-width="1.4"/>
<text x="210.0" y="178.0" font-size="11.5" text-anchor="start" fill="#1b1b1f" font-weight="600">node-b</text>
<text x="210.0" y="198.0" font-size="10.5" text-anchor="start" fill="#1b1b1f" font-weight="normal">slot: right</text>
<text x="210.0" y="216.0" font-size="10.0" text-anchor="start" fill="#b3441c" font-weight="normal">lineage root: R2</text>
<text x="210.0" y="232.0" font-size="10.0" text-anchor="start" fill="#b3441c" font-weight="normal">failure domain: FD2</text>
<text x="318.0" y="178.0" font-size="10.5" text-anchor="end" fill="#6b7280" font-weight="normal">0.93</text>
<line x1="264.0" y1="156.0" x2="264.0" y2="126.0" stroke="#b3441c" stroke-width="1.2" opacity="0.6"/>
<rect x="356.0" y="156.0" width="132.0" height="96.0" rx="5" fill="#ffffff" stroke="#b3441c" stroke-width="1.4"/>
<text x="368.0" y="178.0" font-size="11.5" text-anchor="start" fill="#1b1b1f" font-weight="600">node-c</text>
<text x="368.0" y="198.0" font-size="10.5" text-anchor="start" fill="#1b1b1f" font-weight="normal">slot: right</text>
<text x="368.0" y="216.0" font-size="10.0" text-anchor="start" fill="#b3441c" font-weight="normal">lineage root: R2</text>
<text x="368.0" y="232.0" font-size="10.0" text-anchor="start" fill="#b3441c" font-weight="normal">failure domain: FD2</text>
<text x="476.0" y="178.0" font-size="10.5" text-anchor="end" fill="#6b7280" font-weight="normal">0.91</text>
<line x1="422.0" y1="156.0" x2="422.0" y2="126.0" stroke="#b3441c" stroke-width="1.2" opacity="0.6"/>
<rect x="514.0" y="156.0" width="132.0" height="96.0" rx="5" fill="#ffffff" stroke="#1f5fa8" stroke-width="1.4"/>
<text x="526.0" y="178.0" font-size="11.5" text-anchor="start" fill="#1b1b1f" font-weight="600">node-d</text>
<text x="526.0" y="198.0" font-size="10.5" text-anchor="start" fill="#1b1b1f" font-weight="normal">slot: right</text>
<text x="526.0" y="216.0" font-size="10.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">lineage root: R3</text>
<text x="526.0" y="232.0" font-size="10.0" text-anchor="start" fill="#1f5fa8" font-weight="normal">failure domain: FD3</text>
<text x="634.0" y="178.0" font-size="10.5" text-anchor="end" fill="#6b7280" font-weight="normal">0.94</text>
<line x1="580.0" y1="156.0" x2="580.0" y2="126.0" stroke="#1f5fa8" stroke-width="1.2" opacity="0.6"/>
<text x="580.0" y="272.0" font-size="10.0" text-anchor="middle" fill="#1f5fa8" font-weight="600">independent path</text>
<text x="28.0" y="306.0" font-size="10.5" text-anchor="start" fill="#b3441c" font-weight="normal">node-b and node-c hold the same premise under the same lineage root and the same failure domain.</text>
<text x="28.0" y="322.0" font-size="10.5" text-anchor="start" fill="#b3441c" font-weight="normal">They look like two chances of answering. They are one: whatever invalidates that root takes both, and no local signal reports it.</text>
<text x="28.0" y="344.0" font-size="10.5" text-anchor="start" fill="#1f5fa8" font-weight="normal">Only the node on an independent root adds a second failure domain — which is what raises the minimum cut from 1 to 2,</text>
<text x="28.0" y="360.0" font-size="10.5" text-anchor="start" fill="#1f5fa8" font-weight="normal">and the min cut, not the replica count, is what predicts survival (figure 2, C5).</text>
</svg>
