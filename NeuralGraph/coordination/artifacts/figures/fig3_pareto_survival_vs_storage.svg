<svg xmlns="http://www.w3.org/2000/svg" width="760.0" height="470.0" viewBox="0 0 760.0 470.0" font-family="'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif">
<title>Figure 3: survival versus storage</title>
<rect width="760.0" height="470.0" fill="#ffffff"/>
<text x="28.0" y="34.0" font-size="15.0" text-anchor="start" fill="#1b1b1f" font-weight="600">Survival is not bought with storage</text>
<text x="28.0" y="54.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">mean bytes moved per intervention vs mean capability survival, 30 seeds</text>
<line x1="92.0" y1="356.0" x2="560.0" y2="356.0" stroke="#d8dade"/>
<text x="82.0" y="360.0" font-size="10.0" text-anchor="end" fill="#6b7280" font-weight="normal">0.0</text>
<line x1="92.0" y1="304.0" x2="560.0" y2="304.0" stroke="#d8dade"/>
<text x="82.0" y="308.0" font-size="10.0" text-anchor="end" fill="#6b7280" font-weight="normal">0.2</text>
<line x1="92.0" y1="252.0" x2="560.0" y2="252.0" stroke="#d8dade"/>
<text x="82.0" y="256.0" font-size="10.0" text-anchor="end" fill="#6b7280" font-weight="normal">0.4</text>
<line x1="92.0" y1="200.0" x2="560.0" y2="200.0" stroke="#d8dade"/>
<text x="82.0" y="204.0" font-size="10.0" text-anchor="end" fill="#6b7280" font-weight="normal">0.6</text>
<line x1="92.0" y1="148.0" x2="560.0" y2="148.0" stroke="#d8dade"/>
<text x="82.0" y="152.0" font-size="10.0" text-anchor="end" fill="#6b7280" font-weight="normal">0.8</text>
<line x1="92.0" y1="96.0" x2="560.0" y2="96.0" stroke="#d8dade"/>
<text x="82.0" y="100.0" font-size="10.0" text-anchor="end" fill="#6b7280" font-weight="normal">1.0</text>
<line x1="92.0" y1="96.0" x2="92.0" y2="356.0" stroke="#d8dade"/>
<text x="92.0" y="374.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">0.0k</text>
<line x1="185.6" y1="96.0" x2="185.6" y2="356.0" stroke="#d8dade"/>
<text x="185.6" y="374.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">2.2k</text>
<line x1="279.2" y1="96.0" x2="279.2" y2="356.0" stroke="#d8dade"/>
<text x="279.2" y="374.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">4.4k</text>
<line x1="372.8" y1="96.0" x2="372.8" y2="356.0" stroke="#d8dade"/>
<text x="372.8" y="374.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">6.6k</text>
<line x1="466.4" y1="96.0" x2="466.4" y2="356.0" stroke="#d8dade"/>
<text x="466.4" y="374.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">8.8k</text>
<line x1="560.0" y1="96.0" x2="560.0" y2="356.0" stroke="#d8dade"/>
<text x="560.0" y="374.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">11.0k</text>
<text x="326.0" y="396.0" font-size="11.0" text-anchor="middle" fill="#1b1b1f" font-weight="normal">mean bytes moved</text>
<text x="26.0" y="226.0" font-size="11.0" text-anchor="middle" fill="#1b1b1f" font-weight="normal" transform="rotate(-90.0 26.0 226.0)">capability survival</text>
<rect x="323.8" y="153.8" width="236.2" height="202.2" fill="#1f5fa8" opacity="0.06"/>
<text x="333.8" y="344.0" font-size="9.5" text-anchor="start" fill="#1f5fa8" font-weight="normal">dominated: more bytes, less survival</text>
<circle cx="150.3" cy="356.0" r="4.0" fill="#1b1b1f"/>
<text x="160.3" y="360.0" font-size="10.0" text-anchor="start" fill="#1b1b1f" font-weight="normal">isolated local</text>
<circle cx="220.5" cy="327.1" r="4.0" fill="#1b1b1f"/>
<text x="230.5" y="331.1" font-size="10.0" text-anchor="start" fill="#1b1b1f" font-weight="normal">centralized</text>
<circle cx="302.3" cy="211.6" r="4.0" fill="#1b1b1f"/>
<text x="312.3" y="215.6" font-size="10.0" text-anchor="start" fill="#1b1b1f" font-weight="normal">fixed replication</text>
<circle cx="302.2" cy="211.6" r="4.0" fill="#1b1b1f"/>
<text x="312.2" y="227.6" font-size="10.0" text-anchor="start" fill="#1b1b1f" font-weight="normal">source-count repair</text>
<circle cx="512.2" cy="182.7" r="5.5" fill="#b3441c"/>
<text x="502.2" y="186.7" font-size="10.0" text-anchor="end" fill="#b3441c" font-weight="600">full replication</text>
<circle cx="318.7" cy="173.0" r="4.0" fill="#1b1b1f"/>
<text x="328.7" y="201.0" font-size="10.0" text-anchor="start" fill="#1b1b1f" font-weight="normal">random diversification</text>
<circle cx="323.8" cy="153.8" r="5.5" fill="#1f5fa8"/>
<text x="333.8" y="157.8" font-size="10.0" text-anchor="start" fill="#1f5fa8" font-weight="600">lineage-aware repair</text>
<polygon points="366.9,118.9 372.9,129.9 360.9,129.9" fill="none" stroke="#6b7280" stroke-width="1.4"/>
<text x="356.9" y="128.9" font-size="10.0" text-anchor="end" fill="#1b1b1f" font-weight="normal">oracle min-cut</text>
<text x="28.0" y="424.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">Lineage-aware repair reaches 0.78 at 5.4k bytes; full replication reaches 0.67 at 9.9k — twice the storage, less survival.</text>
<text x="28.0" y="440.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">The oracle (open triangle) is an upper bound, not a deployable policy: it separates from lineage-aware repair on one intervention.</text>
<text x="28.0" y="456.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">Survival averages 9 interventions including the partition, which no distributed strategy survives.</text>
</svg>
