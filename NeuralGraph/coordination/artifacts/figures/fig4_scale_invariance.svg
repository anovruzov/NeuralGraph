<text x="28.0" y="522.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">Rows are policy x intervention x lineage independence; columns are premises per capability (K) and holders per premise (H).</text>
<text x="28.0" y="538.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">Every row is uniform: the verdict is set by lineage independence, never by K or H. One exception would show as a single odd mark.</text>
<text x="28.0" y="554.0" font-size="10.0" text-anchor="start" fill="#b3441c" font-weight="normal">The one I1 row that survives is source-count repair under node failure: a correlated replica serves when the node, not the lineage, is what failed.</text>
