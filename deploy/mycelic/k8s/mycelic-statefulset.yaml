apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mycelic
spec:
  serviceName: mycelic
  replicas: 1                # SQLite: exactly one writer. Never scale this; see DEPLOYMENT.md for the scale-out path.
  selector:
    matchLabels:
      app: mycelic
  template:
    metadata:
      labels:
        app: mycelic
      # no prometheus.io annotations: /metrics needs a bearer token; see servicemonitor.example.yaml
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 30   # >= 2 x MYCELIC_SHUTDOWN_TIMEOUT_SECONDS + 5: HTTP drain, then broker drain
      containers:
        - name: mycelic
          image: mycelic:0.2.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
          envFrom:
            - configMapRef: {name: mycelic-config}
          env:
            - name: MYCELIC_ADMIN_TOKEN
              valueFrom: {secretKeyRef: {name: mycelic-secrets, key: MYCELIC_ADMIN_TOKEN}}
            - name: MYCELIC_EVENT_SIGNING_KEY
              valueFrom: {secretKeyRef: {name: mycelic-secrets, key: MYCELIC_EVENT_SIGNING_KEY}}
            - name: MYCELIC_EVENT_SIGNING_KEYS_PREVIOUS
              valueFrom: {secretKeyRef: {name: mycelic-secrets, key: MYCELIC_EVENT_SIGNING_KEYS_PREVIOUS, optional: true}}
            - name: MYCELIC_NATS_USER
              valueFrom: {secretKeyRef: {name: mycelic-secrets, key: NATS_USER}}
            - name: MYCELIC_NATS_PASSWORD
              valueFrom: {secretKeyRef: {name: mycelic-secrets, key: NATS_PASSWORD}}
            - name: MYCELIC_METRICS_TOKEN
              valueFrom: {secretKeyRef: {name: mycelic-secrets, key: MYCELIC_METRICS_TOKEN, optional: true}}
          ports:
            - {name: http, containerPort: 8080}
          # /health and /ready answer from a status snapshot and never wait on the broker.  A rebuild from the event
          # log does not gate startup (that would kill a long replay); it gates readiness: the pod stays unready
          # until the replay is done and is never restarted for it.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: rules, mountPath: /etc/mycelic, readOnly: true}
      volumes:
        - name: rules
          configMap:
            name: mycelic-config
            items:
              - {key: rules.json, path: rules.json}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <a block storage class>; SQLite in WAL mode must not live on NFS/RWX storage
        resources:
          requests:
            storage: 10Gi
