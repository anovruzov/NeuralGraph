apiVersion: v1
kind: ConfigMap
metadata:
  name: mycelic-config
data:
  MYCELIC_HOST: "0.0.0.0"
  MYCELIC_PORT: "8080"
  MYCELIC_DB_PATH: /data/mycelic.db
  MYCELIC_NATS_URL: nats://nats.mycelic.svc:4222
  MYCELIC_RULES_FILE: /etc/mycelic/rules.json
  MYCELIC_LOG_LEVEL: INFO
  MYCELIC_MIN_SUPPORT: "2"
  MYCELIC_SHUTDOWN_TIMEOUT_SECONDS: "10"    # SIGTERM budget; keep 2x + 5 <= terminationGracePeriodSeconds (30)
  MYCELIC_MAX_ACTIVE_MEMORIES_PER_ORG: "5000"  # active raw notes per organization (DEPLOYMENT.md, "Volume cap"); 0 = no limit
  MYCELIC_REPLAY_MAX_REJECT_RATIO: "0.01"   # replay signature rejections tolerated before /ready stays 503
  MYCELIC_VERIFY_MAX_NODES: "25000"         # nodes one downward verification walks at most
  MYCELIC_EXPIRY_SWEEP_SECONDS: "30"        # 0 disables the expiry sweep
  MYCELIC_DERIVED_RETENTION_DAYS: "7"       # days previous versions of derived memories are kept; 0 = forever
  MYCELIC_ALLOWED_HOSTS: ""                 # set to the Ingress host, e.g. mycelic.example.com
  MYCELIC_TRUST_PROXY_HEADERS: "true"       # the Ingress terminates TLS and forwards X-Forwarded-For
  # the exact text of deploy/mycelic/rules.json (the Compose deployment mounts that file); keep the two in sync
  rules.json: |
    {
      "rules": [
        {
          "rule_id": "component_supply_risk",
          "target_layer": "enterprise",
          "topic_prefix": "supply:",
          "required_slots": ["transport_disruption", "supplier_buffer_low", "demand_commitment"],
          "min_agents": 3,
          "min_teams": 2,
          "kind": "risk",
          "conclusion": "Supply risk for {entity}: inbound transport is disrupted ({slot:transport_disruption}); the supplier buffer is thin ({slot:supplier_buffer_low}); demand is committed ({slot:demand_commitment}).",
          "metadata": {"owner": "operations", "review": "weekly"}
        },
        {
          "rule_id": "regional_supply_risk",
          "target_layer": "region",
          "topic_prefix": "supply:",
          "required_slots": ["transport_disruption", "supplier_buffer_low", "demand_commitment"],
          "min_agents": 3,
          "min_teams": 2,
          "kind": "risk",
          "emits_slot": "supply_risk",
          "emits_topic": "strategy:supply-risk",
          "conclusion": "Regional supply risk for {entity}: transport is disrupted ({slot:transport_disruption}); the supplier buffer is thin ({slot:supplier_buffer_low}); demand is committed ({slot:demand_commitment}).",
          "metadata": {"owner": "regional operations", "feeds": "strategic_second_source"}
        },
        {
          "rule_id": "strategic_second_source",
          "target_layer": "enterprise",
          "required_slots": ["supply_risk", "demand_growth", "supplier_concentration"],
          "sources": ["slot_composition", "topic_consolidation", "agent_observation"],
          "min_units": {"supply_risk": {"region": 2}},
          "min_agents": 4,
          "min_teams": 3,
          "corroborate": true,
          "kind": "decision",
          "emits_slot": "sourcing_decision",
          "emits_topic": "strategy:sourcing",
          "conclusion": "Strategic recommendation for {entity}: qualify a second source. The supply risk is corroborated in more than one region ({slot:supply_risk}); demand is growing ({slot:demand_growth}); the supply base is concentrated ({slot:supplier_concentration}).",
          "metadata": {"owner": "strategy office", "decision_forum": "quarterly sourcing review"}
        }
      ]
    }
