# NOT applied by the kustomization. Create the real secret out of band, for example:
#   kubectl -n mycelic create secret generic mycelic-secrets \
#     --from-literal=MYCELIC_ADMIN_TOKEN=$(openssl rand -hex 32) \
#     --from-literal=MYCELIC_EVENT_SIGNING_KEY=$(openssl rand -hex 32) \
#     --from-literal=NATS_USER=mycelic \
#     --from-literal=NATS_PASSWORD=n$(openssl rand -hex 32) \
#     --from-literal=MYCELIC_METRICS_TOKEN=$(openssl rand -hex 32)
# or with your secret manager (External Secrets, Sealed Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: mycelic-secrets
  namespace: mycelic
type: Opaque
stringData:
  MYCELIC_ADMIN_TOKEN: ""
  MYCELIC_EVENT_SIGNING_KEY: ""
  MYCELIC_EVENT_SIGNING_KEYS_PREVIOUS: ""  # comma-separated keys from before a rotation; empty until you rotate (DEPLOYMENT.md §4)
  NATS_USER: mycelic
  NATS_PASSWORD: ""                # must start with a letter (see nats-configmap.yaml)
  MYCELIC_METRICS_TOKEN: ""
