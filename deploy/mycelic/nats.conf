# NATS server configuration for Mycelic (docs/mycelic/DECISIONS.md D4).
#
# One account (MYCELIC) with JetStream enabled. The coordinator (API + worker) connects as `core`; every evidence
# holder connects as its own user and is confined, by subject permissions, to its own inbox subjects, the
# reply subjects it needs, and the JetStream consumer named after its holder id.
#
# Verified with nats-server v2.11.4 and nats-py 2.16 (`nats-server -t -c nats.conf` plus a live run in which
# `core` created the stream and its consumers, `holder_a` bound only its own consumer, could not create one on
# holder_b's subjects, bind core's consumer, publish outside its allowed subjects or read holder_b's inbox, and
# ack / reply worked). Permission checks on `$JS.API.>` subjects depend on how the server version lays out the
# JetStream API (the filtered CONSUMER.CREATE form needs >= 2.9); re-check this file against the release notes
# when upgrading the server.
#
# Secrets: `$NAME` is resolved from a variable defined in this file or, failing that, from the process
# environment, so run the server with MYCELIC_NATS_CORE_PASSWORD, MYCELIC_NATS_SYS_PASSWORD and one
# MYCELIC_NATS_HOLDER_<ID>_PASSWORD per holder exported (docker-compose passes them through). The server
# refuses to start when a referenced variable is missing. Hashed passwords (`nats-server passwd`) can be pasted
# in place of a variable; the client still sends the clear-text password.

server_name: mycelic-nats
listen: 0.0.0.0:4222
http: 0.0.0.0:8222          # monitoring endpoints (/varz, /jsz, /connz); keep it on the private network

max_payload: 8MB            # raw-evidence replies carry policy-approved excerpts only, never whole stores

jetstream {
    store_dir: /data/jetstream
    max_mem_store: 256MB
    max_file_store: 10GB     # stream MYCELIC keeps `mycelic.>` for MYCELIC_TRANSPORT_RETENTION_SECONDS (max_age)
}

# The system account is only for the monitoring CLI (`nats server ...`); no application user lives in it.
system_account: SYS

accounts {
    SYS {
        users: [
            { user: sys, password: $MYCELIC_NATS_SYS_PASSWORD }
        ]
    }

    MYCELIC {
        jetstream: enabled

        users: [
            # ------------------------------------------------------------------ coordinator
            # Publishes questions to holder inboxes and ingest/control/raw requests, consumes everything holders
            # send back (mycelic.<tenant>.responses | ingest_results | evidence_events), owns the stream and
            # every core consumer. `_INBOX.>` carries JetStream API replies, pull-fetch deliveries and
            # request/reply answers. `$JS.ACK.>` is where consumers acknowledge.
            {
                user: core
                password: $MYCELIC_NATS_CORE_PASSWORD
                permissions: {
                    publish: { allow: ["mycelic.>", "_INBOX.>", "$JS.API.>", "$JS.ACK.>"] }
                    subscribe: { allow: ["mycelic.>", "_INBOX.>"] }
                }
            }

            # ------------------------------------------------------------------ holders (one user per holder)
            # Template: copy this block for each holder, replacing `holder_a` (the NATS user name) and the holder
            # id token `holder_a` inside the subjects with the holder's `holder_id` from the coordination DB. The
            # holder process runs with MYCELIC_NATS_USER=<user> MYCELIC_NATS_PASSWORD=<password> and subscribes
            # exactly once, with consumer name == holder_id, to `mycelic.<tenant>.holder.<holder_id>.>`
            # (inbox, ingest, raw and control land on that one durable consumer). Holder ids are dynamic, so in a
            # real deployment generate this block per holder (a small script rendering it from the holders
            # table) into a separate file and pull it in here with `include "holders.conf"` — `include` paths
            # are relative to this file — then reload the server with SIGHUP (`nats-server --signal reload`).
            #
            # What each line is for:
            #   subscribe mycelic.*.holder.<id>.>           core NATS interest on its own subjects only
            #   subscribe _INBOX.>                          JetStream API replies and pull deliveries arrive here
            #   publish   mycelic.*.responses               answers to questions
            #   publish   mycelic.*.ingest_results          ingest outcomes
            #   publish   mycelic.*.evidence_events         evidence revised / retracted notifications
            #   publish   _INBOX.>                          replies to `request` (raw-evidence fetches)
            #   publish   $JS.API.STREAM.INFO.MYCELIC       NatsTransport(manage_stream=False) checks the stream exists
            #   publish   $JS.API.CONSUMER.INFO.MYCELIC.<id>                     bind to its durable consumer
            #   publish   $JS.API.CONSUMER.CREATE.MYCELIC.<id>.mycelic.*.holder.<id>.>
            #             create it — the filter subject is part of the API subject (nats-server >= 2.9), which
            #             is what stops a holder from creating a consumer that filters on another holder's
            #             subjects; the unfiltered forms `$JS.API.CONSUMER.CREATE.MYCELIC.<id>` and
            #             `$JS.API.CONSUMER.DURABLE.CREATE.MYCELIC.<id>` are deliberately NOT allowed because
            #             they carry the filter only in the request body
            #   publish   $JS.API.CONSUMER.MSG.NEXT.MYCELIC.<id>                 pull messages from it
            #   publish   $JS.ACK.MYCELIC.<id>.>                                 ack / nak its own deliveries only
            #             (with a JetStream `domain` configured the ack subject gains two tokens after `$JS.ACK`;
            #             use `$JS.ACK.*.*.MYCELIC.<id>.>` then, or the broad `$JS.ACK.>` if you accept that a
            #             holder could then acknowledge sequence numbers on other consumers)
            {
                user: holder_a
                password: $MYCELIC_NATS_HOLDER_A_PASSWORD
                permissions: {
                    subscribe: { allow: ["mycelic.*.holder.holder_a.>", "_INBOX.>"] }
                    publish: {
                        allow: [
                            "mycelic.*.responses",
                            "mycelic.*.ingest_results",
                            "mycelic.*.evidence_events",
                            "_INBOX.>",
                            "$JS.API.STREAM.INFO.MYCELIC",
                            "$JS.API.CONSUMER.INFO.MYCELIC.holder_a",
                            "$JS.API.CONSUMER.CREATE.MYCELIC.holder_a.mycelic.*.holder.holder_a.>",
                            "$JS.API.CONSUMER.MSG.NEXT.MYCELIC.holder_a",
                            "$JS.ACK.MYCELIC.holder_a.>"
                        ]
                    }
                }
            }
            {
                user: holder_b
                password: $MYCELIC_NATS_HOLDER_B_PASSWORD
                permissions: {
                    subscribe: { allow: ["mycelic.*.holder.holder_b.>", "_INBOX.>"] }
                    publish: {
                        allow: [
                            "mycelic.*.responses",
                            "mycelic.*.ingest_results",
                            "mycelic.*.evidence_events",
                            "_INBOX.>",
                            "$JS.API.STREAM.INFO.MYCELIC",
                            "$JS.API.CONSUMER.INFO.MYCELIC.holder_b",
                            "$JS.API.CONSUMER.CREATE.MYCELIC.holder_b.mycelic.*.holder.holder_b.>",
                            "$JS.API.CONSUMER.MSG.NEXT.MYCELIC.holder_b",
                            "$JS.ACK.MYCELIC.holder_b.>"
                        ]
                    }
                }
            }
        ]
    }
}

# Operational notes
# * Stream MYCELIC is created by the coordinator on start (subjects mycelic.>, retention limits, file storage,
#   max_age = MYCELIC_TRANSPORT_RETENTION_SECONDS, duplicate_window = min(120s, max_age)). It is not defined
#   here on purpose: the server config cannot express it and the coordinator converges it on every start.
# * Rotate a holder's password by changing the variable and reloading; revoke a holder by deleting its user block
#   and reloading — its durable consumer stays in the stream until `nats consumer rm MYCELIC <holder_id>`.
# * TLS: add a `tls { cert_file, key_file, ca_file, verify: true }` block and switch clients to tls:// URLs
#   before putting holders on another network.
