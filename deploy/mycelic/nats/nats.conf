# NATS with JetStream for Mycelic. Secrets arrive as environment variables: unquoted $VAR references are
# substituted by nats-server at start (a quoted "$VAR" would be taken literally). Validate with:
#   NATS_USER=u NATS_PASSWORD=p NATS_STORE_DIR=/tmp/js nats-server -t -c deploy/mycelic/nats/nats.conf
server_name: mycelic-nats
port: 4222

# Monitoring endpoint used by the container healthcheck (/healthz). Never publish this port.
http_port: 8222

jetstream {
  store_dir: $NATS_STORE_DIR
  # Hard cap for the file store. The MYCELIC stream is unbounded by design (replay needs the whole history), so
  # size this to the volume and watch mycelic_transport_connected / stream_bytes in /admin/status.
  max_file_store: 20GB
  max_memory_store: 256MB
}

# One service account. Only the Mycelic service (and operators) may talk to the broker; agents never connect
# to NATS directly, they use the HTTP API. See SECURITY.md: whoever holds these credentials is inside the
# trust boundary, which is why Mycelic additionally signs every event (MYCELIC_EVENT_SIGNING_KEY).
authorization {
  user: $NATS_USER
  password: $NATS_PASSWORD
}
