name: market-count

# Counts medical-device owner/operators by FDA-registered establishments and countries, and measures how often device
# complaint reports carry lot numbers, narratives and specific problem codes (public openFDA data), for
# docs/strategy/MARKET.md. Runs where api.fda.gov is reachable; results print in the job log between MARKET-COUNT and
# COVERAGE markers and upload as an artifact.
on:
  push:
    branches-ignore: [main]
    paths: ["tools/market/**", ".github/workflows/market-count.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  count:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: offline tests
        run: python -m unittest tests.market.test_openfda_establishments tests.market.test_openfda_coverage tests.market.test_openfda_sites tests.market.test_openfda_replay_inputs tests.market.test_replay_pack -v
      - name: replay 002 id shapes (docs/collective/replay/CHOICE-002.md; events received before the window only)
        run: python tools/market/openfda_id_shapes.py --out id-shapes.json --word BECTON --codes JKA,FOZ,FMI,MDB --date-from 20210101 --date-to 20221231 --top 100
      - name: replay 002 pack rule applied to the id shapes (no pack is written here)
        run: python tools/market/replay_pack.py --shapes id-shapes.json --id device_quality_bd --out unused --plan-only
      - name: count
        run: python tools/market/openfda_establishments.py --out market-count.json
      - name: field coverage of device complaint reports
        run: python tools/market/openfda_coverage.py --out field-coverage.json --year 2024 --codes 10 --sample 100
      - name: can a manufacturer's reports be split into its sites
        run: python tools/market/openfda_sites.py --out site-split.json --year 2024
      - name: replay choice inputs (docs/collective/replay/CHOICE-001.md; event counts and firm names only)
        run: python tools/market/openfda_replay_inputs.py --out replay-inputs.json --word BECTON --codes JKA,FOZ,FMI,FMF,FPA,MDB --first-year 2019 --last-year 2024 --cap 10000
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: market-count
          path: |
            market-count.json
            field-coverage.json
            site-split.json
            replay-inputs.json
            id-shapes.json
          if-no-files-found: warn
          retention-days: 30
