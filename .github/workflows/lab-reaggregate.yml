name: lab-reaggregate

# Rebuild a finished mycelic-lab run's report with this commit's lab.aggregate and lab.summary, from that run's own
# artifacts: no unit runs again. The request is lab/reaggregate/<name>.json, {"run_id": <run id>, "purpose": "..."}
# (lab/reaggregate.py); the report says it is a re-aggregation, of which run and by which commit.

on:
  push:
    branches-ignore: [main]
    paths: ["lab/reaggregate/*.json"]
  workflow_dispatch:
    inputs:
      request:
        description: "re-aggregation request, lab/reaggregate/<name>.json"
        required: true
        type: string

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHONUNBUFFERED: "1"

jobs:
  reaggregate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - id: find
        run: >-
          python -m lab.reaggregate find --event-path "$GITHUB_EVENT_PATH" --event-name "$GITHUB_EVENT_NAME"
          --github-output "$GITHUB_OUTPUT"
      - id: download
        if: steps.find.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: lab-*
          path: ${{ runner.temp }}/lab-artifacts
          run-id: ${{ steps.find.outputs.run_id }}
          github-token: ${{ github.token }}
      - id: sort
        if: steps.find.outputs.run_id != ''
        env:
          LAB_RUN_ID: ${{ steps.find.outputs.run_id }}
        run: >-
          python -m lab.reaggregate sort --artifacts "$RUNNER_TEMP/lab-artifacts" --run-id "$LAB_RUN_ID"
          --out "$RUNNER_TEMP/lab-in" --github-output "$GITHUB_OUTPUT"
      - id: aggregate
        if: steps.find.outputs.run_id != ''
        env:
          LAB_REQUEST: ${{ steps.find.outputs.request }}
        run: >-
          python -m lab.aggregate --plan "$RUNNER_TEMP/lab-in/plan/plan.json" --provision "$RUNNER_TEMP/lab-in/provision"
          --shards "$RUNNER_TEMP/lab-in/shards" --manifest lab/models.json --out "$RUNNER_TEMP/lab-report"
          --reaggregation "$LAB_REQUEST"
      - if: ${{ !cancelled() && steps.find.outputs.run_id != '' }}
        run: >-
          python -m lab.summary report --dir "$RUNNER_TEMP/lab-report" --append-to "$GITHUB_STEP_SUMMARY"
          --md-out "$RUNNER_TEMP/lab-report/report.md" --sources-out "$RUNNER_TEMP/lab-report/report.sources.json" --log
      - if: ${{ !cancelled() && steps.find.outputs.run_id != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lab-reaggregate-${{ steps.find.outputs.run_id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lab-report
          if-no-files-found: error
          retention-days: ${{ steps.sort.outputs.retention_days || 1 }}
