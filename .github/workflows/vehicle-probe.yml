name: vehicle-probe

# Schema-only probe of NHTSA's defect investigation file (tools/market/nhtsa_inv_probe.py): the field list, and each
# candidate flat file's size, rows and fields per row; no investigation's content. Prints between NHTSA-INV-PROBE
# markers in the job log and uploads as an artifact.
on:
  push:
    branches-ignore: [main]
    paths: ["tools/market/nhtsa_inv_probe.py", ".github/workflows/vehicle-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: offline tests
        run: python -m unittest tests.market.test_vehicle_replay -v
      - name: probe
        run: python tools/market/nhtsa_inv_probe.py --out nhtsa-inv-probe.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vehicle-probe
          path: nhtsa-inv-probe.json
          if-no-files-found: warn
          retention-days: 30
