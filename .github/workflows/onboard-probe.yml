name: onboard-probe

# Schema-and-volume probe of the public CFPB consumer complaint database (tools/onboard/cfpb_probe.py): complaint
# counts per year, field names, the API's aggregation buckets and the bulk export's size; no complaint's text. It
# decides whether a pack-drafting test can use a field no pack covers. Prints between markers and uploads an artifact.
on:
  push:
    branches-ignore: [main]
    paths: ["tools/onboard/cfpb_probe.py", ".github/workflows/onboard-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: probe
        run: python tools/onboard/cfpb_probe.py --out cfpb-probe.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: onboard-probe
          path: cfpb-probe.json
          if-no-files-found: warn
          retention-days: 30
