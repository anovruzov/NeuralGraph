name: vehicle-replay

# Public replays V001 and V002 (docs/collective/replay/vehicles/CHOICE-V00*.md): NHTSA complaints and recalls of one
# make, or of each make a run file lists, through the pilot audit, where static.nhtsa.gov is reachable. Starts when a
# run file changes and runs the newest one. Each audit prints as one line between VEHICLE-AUDIT markers in the job log
# (V002 then a VEHICLE-SUMMARY line combining the makes) and uploads as an artifact.
on:
  push:
    branches-ignore: [main]
    paths: ["docs/collective/replay/vehicles/run-*.json"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: offline tests
        run: python -m unittest tests.market.test_vehicle_replay -v
      - name: export (complaints and recalls of the run file's makes and window)
        run: |
          RUN=$(ls docs/collective/replay/vehicles/run-*.json | sort | tail -n 1)
          echo "run file: $RUN"
          echo "RUN=$RUN" >> "$GITHUB_ENV"
          python tools/market/nhtsa_export.py --run "$RUN" --pack docs/collective/replay/vehicles/pack --out vexport
      - name: pilot audit (one per make)
        run: |
          read -r LOOKBACK POST < <(python -c "import json,sys; r=json.load(open(sys.argv[1])); print(r['lookback_weeks'], r['post_weeks'])" "$RUN")
          if [ -f vexport/export.csv ]; then DIRS=vexport; else DIRS=$(ls -d vexport/*/); fi
          for D in $DIRS; do
            if [ "$D" = vexport ]; then OUT=vaudit; else OUT=vaudit/$(basename "$D"); fi
            python -m mycelic.collective.pilot.audit run --pack docs/collective/replay/vehicles/pack --records "$D/export.csv" --outcomes "$D/outcomes.csv" --out "$OUT" --lookback-weeks "$LOOKBACK" --post-weeks "$POST" --tie-salt pilot
          done
      - name: print the audits
        if: always()
        run: |
          for F in $(find vaudit -name audit.json 2>/dev/null | sort); do
            echo "=== VEHICLE-AUDIT BEGIN file=$F sha256=$(sha256sum "$F" | cut -c1-64) ==="
            python -c "import json,sys; print(json.dumps(json.load(open(sys.argv[1])), sort_keys=True, separators=(',', ':')))" "$F"
            echo "=== VEHICLE-AUDIT END ==="
          done
          if [ ! -f vaudit/audit.json ] && [ -d vaudit ]; then
            echo "=== VEHICLE-SUMMARY BEGIN ==="; python tools/market/vehicle_summary.py vaudit; echo "=== VEHICLE-SUMMARY END ==="
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: vehicle-replay
          path: vaudit/
          if-no-files-found: warn
          retention-days: 30
