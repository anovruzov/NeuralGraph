name: l1-guard-probe

# Latency test L001's first run (lab run 38090725021, commit 2dff113) stopped at the plan job's guard: one refused value
# of MSHA's file was found as a whole word in plan.json, which lab.plan writes before the file is read. This probe
# (tools/l1/guard_probe.py) counts where such coincidences fall: in plan.json as run 1 wrote it, in the files of judge
# test J001's run (37996675559: server logs, run.json, ledgers, reports of small models on CPU), and in the lab's code
# and docs. A second pass rebuilds the guard as K14 has it (CHOICE-L001.md: the values found as whole words in the
# plan's own text left out) with run 1's regenerated plan.json, and prints the same counts as "after K14" lines, with
# the number left out. It prints counts by class and by refused column only, never a value, token, file name or index.
on:
  push:
    branches-ignore: [main]
    paths: ["tools/l1/guard_probe.py", ".github/workflows/l1-guard-probe.yml"]

permissions:
  contents: read
  actions: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2dff11348c02e7a7982cb2d83b02a92b200c9ca1
          path: run1
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: plan.json as run 1 wrote it
        working-directory: run1
        run: python -m lab.plan --request lab/requests/latency-001.json --manifest lab/models.json --out "$RUNNER_TEMP/plan1"
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/lab-msha
          key: lab-msha-62d0c861a5c3a8e7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: 37996675559
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/j1-artifacts
      - name: probe
        run: >-
          python tools/l1/guard_probe.py --raw "$RUNNER_TEMP/lab-msha" --plan "$RUNNER_TEMP/plan1/plan.json"
          --artifacts "$RUNNER_TEMP/j1-artifacts" --out l1-guard-probe.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: l1-guard-probe
          path: l1-guard-probe.json
          if-no-files-found: warn
          retention-days: 30
