name: research

# The research track's checks take about 15 minutes on a macOS runner and only depend on the research crate, so they
# run when that crate (or the workspace manifests) changes instead of on every pull request.
on:
  push:
    branches: [main]
    paths:
      - "crates/neuralgraph-research/**"
      - "research/**"
      - "Cargo.toml"
      - ".github/workflows/research.yml"
  pull_request:
    paths:
      - "crates/neuralgraph-research/**"
      - "research/**"
      - "Cargo.toml"
      - ".github/workflows/research.yml"
  # Cargo.lock is left out on purpose: every product release changes it (the version line). Run this by hand after a
  # lockfile-only dependency update.
  workflow_dispatch:

jobs:
  research:
    name: research track (Rust) — clippy, tests, pinned artifacts
    # macOS: the fixtures pin numpy's float32 arithmetic, which numpy took from Accelerate, and the crate calls the
    # same routines. Accelerate's last bits still differ between Apple CPU generations, so on CI's runners the
    # float32-BLAS parity checks take their tolerance path (NEURALGRAPH_BLAS_TOLERANT); everything else stays exact.
    runs-on: macos-latest
    env:
      NEURALGRAPH_BLAS_TOLERANT: "1"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p neuralgraph-research --all-targets --locked -- -D warnings
      # golden-fixture parity with the Python reference (last Python commit eba2f370)
      - run: cargo test -p neuralgraph-research --release --locked
      - name: the coordination track regenerates its pinned artifacts byte for byte
        run: |
          out="$RUNNER_TEMP/coordination"
          mkdir -p "$out/figures"
          cargo build -p neuralgraph-research --release --locked --bin coordination
          bin=target/release/coordination
          $bin experiment --output "$out/experiment_seed20260813.json"
          $bin benchmark --output "$out/benchmark_seed20260813.json"
          $bin benchmark --sweep 30 --output "$out/benchmark_sweep30_seed20260813.json"
          $bin scale --output "$out/scale_seed20260813.json"
          $bin figures --output-dir "$out/figures"
          (cd "$out" && shasum -a 256 -c "$GITHUB_WORKSPACE/research/coordination/artifacts/SHA256SUMS")
