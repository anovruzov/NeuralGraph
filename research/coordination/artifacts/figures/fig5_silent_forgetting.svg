<svg xmlns="http://www.w3.org/2000/svg" width="760.0" height="372.0" viewBox="0 0 760.0 372.0" font-family="'Source Sans Pro','Helvetica Neue',Helvetica,Arial,sans-serif">
<title>Figure 5: silent forgetting</title>
<rect width="760.0" height="372.0" fill="#ffffff"/>
<text x="28.0" y="34.0" font-size="15.0" text-anchor="start" fill="#1b1b1f" font-weight="600">Lost capabilities report the highest confidence of all</text>
<text x="28.0" y="54.0" font-size="10.5" text-anchor="start" fill="#6b7280" font-weight="normal">post-intervention confidence per strategy x intervention cell, single pinned seed</text>
<line x1="250.0" y1="94.0" x2="250.0" y2="244.0" stroke="#d8dade"/>
<text x="250.0" y="262.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">0.88</text>
<line x1="308.3" y1="94.0" x2="308.3" y2="244.0" stroke="#d8dade"/>
<text x="308.3" y="262.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">0.90</text>
<line x1="366.7" y1="94.0" x2="366.7" y2="244.0" stroke="#d8dade"/>
<text x="366.7" y="262.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">0.92</text>
<line x1="425.0" y1="94.0" x2="425.0" y2="244.0" stroke="#d8dade"/>
<text x="425.0" y="262.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">0.94</text>
<line x1="483.3" y1="94.0" x2="483.3" y2="244.0" stroke="#d8dade"/>
<text x="483.3" y="262.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">0.96</text>
<line x1="541.7" y1="94.0" x2="541.7" y2="244.0" stroke="#d8dade"/>
<text x="541.7" y="262.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">0.98</text>
<line x1="600.0" y1="94.0" x2="600.0" y2="244.0" stroke="#d8dade"/>
<text x="600.0" y="262.0" font-size="10.0" text-anchor="middle" fill="#6b7280" font-weight="normal">1.00</text>
<text x="230.0" y="122.0" font-size="10.5" text-anchor="end" fill="#1f5fa8" font-weight="normal">capability intact</text>
<text x="230.0" y="137.0" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">39 cells</text>
<circle cx="337.5" cy="118.0" r="15.9" fill="#1f5fa8" opacity="0.55"/>
<text x="337.5" y="121.5" font-size="9.0" text-anchor="middle" fill="#ffffff" font-weight="normal">18</text>
<circle cx="366.7" cy="118.0" r="6.5" fill="#1f5fa8" opacity="0.55"/>
<text x="366.7" y="121.5" font-size="9.0" text-anchor="middle" fill="#ffffff" font-weight="normal">1</text>
<circle cx="395.8" cy="118.0" r="9.9" fill="#1f5fa8" opacity="0.55"/>
<text x="395.8" y="121.5" font-size="9.0" text-anchor="middle" fill="#ffffff" font-weight="normal">7</text>
<circle cx="425.0" cy="118.0" r="7.7" fill="#1f5fa8" opacity="0.55"/>
<text x="425.0" y="121.5" font-size="9.0" text-anchor="middle" fill="#ffffff" font-weight="normal">3</text>
<circle cx="483.3" cy="118.0" r="11.5" fill="#1f5fa8" opacity="0.55"/>
<text x="483.3" y="121.5" font-size="9.0" text-anchor="middle" fill="#ffffff" font-weight="normal">10</text>
<text x="230.0" y="168.0" font-size="10.5" text-anchor="end" fill="#b3441c" font-weight="600">lost, silently: still confident</text>
<text x="230.0" y="183.0" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">24 cells</text>
<circle cx="395.8" cy="164.0" r="9.3" fill="#b3441c" opacity="0.55"/>
<text x="395.8" y="167.5" font-size="9.0" text-anchor="middle" fill="#ffffff" font-weight="normal">6</text>
<circle cx="483.3" cy="164.0" r="15.9" fill="#b3441c" opacity="0.55"/>
<text x="483.3" y="167.5" font-size="9.0" text-anchor="middle" fill="#ffffff" font-weight="normal">18</text>
<text x="230.0" y="214.0" font-size="10.5" text-anchor="end" fill="#6b7280" font-weight="normal">lost, visibly: no answer offered</text>
<text x="230.0" y="229.0" font-size="9.5" text-anchor="end" fill="#6b7280" font-weight="normal">9 cells</text>
<text x="248.0" y="214.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">9 at confidence 0.00</text>
<text x="425.0" y="286.0" font-size="11.0" text-anchor="middle" fill="#1b1b1f" font-weight="normal">post-intervention confidence</text>
<text x="28.0" y="310.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">Marks are sized and labelled by the number of cells sharing that confidence.</text>
<text x="28.0" y="326.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">The two lanes occupy the same range, 0.91-0.96, and the highest confidence in the figure is reported by cells that lost the capability.</text>
<text x="28.0" y="342.0" font-size="10.0" text-anchor="start" fill="#b3441c" font-weight="normal">No confidence threshold separates the two lanes, so no monitor reading confidence can detect the loss.</text>
<text x="28.0" y="358.0" font-size="10.0" text-anchor="start" fill="#6b7280" font-weight="normal">The visibly lost cells are the isolated-local baseline: it offers no answer, which is a failure a monitor can see.</text>
</svg>
