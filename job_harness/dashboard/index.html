<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Job Harness</title>
<style>
:root{
  --bg:#0e1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
  --text:#e6edf3; --dim:#8b949e; --accent:#2f81f7;
  --ok:#3fb950; --warn:#d29922; --bad:#f85149; --idle:#6e7681;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f6f8fa;--panel:#fff;--panel2:#f0f3f6;--line:#d0d7de;--text:#1f2328;--dim:#636c76;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 12px);}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--line);
  padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:.2px}
.pill{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--panel2);color:var(--dim);white-space:nowrap}
.pill.RUNNING{color:var(--ok);border-color:var(--ok)}
.pill.PAUSED{color:var(--warn);border-color:var(--warn)}
.pill.STOPPED,.pill.FINISHED{color:var(--idle)}
main{padding:14px;max-width:1000px;margin:0 auto}
section{margin-bottom:16px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
  margin:0 0 8px 2px;font-weight:600}
.grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(108px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.card .n{font-size:24px;font-weight:680;font-variant-numeric:tabular-nums;line-height:1.1}
.card .k{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.card.ok .n{color:var(--ok)} .card.warn .n{color:var(--warn)} .card.bad .n{color:var(--bad)}
.controls{display:grid;gap:8px;grid-template-columns:repeat(4,1fr)}
button{font:inherit;font-weight:600;padding:13px 8px;border-radius:10px;border:1px solid var(--line);
  background:var(--panel2);color:var(--text);cursor:pointer;-webkit-tap-highlight-color:transparent}
button:active{transform:scale(.97)}
button.start{border-color:var(--ok);color:var(--ok)}
button.pause{border-color:var(--warn);color:var(--warn)}
button.stop{border-color:var(--bad);color:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);
  padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
td{padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tag{font-size:11px;padding:2px 7px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.tag.VERIFIED,.tag.READY_TO_SUBMIT{color:var(--ok);border-color:var(--ok)}
.tag.SUBMITTED{color:var(--accent);border-color:var(--accent)}
.tag.BLOCKED{color:var(--warn);border-color:var(--warn)}
.tag.FAILED{color:var(--bad);border-color:var(--bad)}
.wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.now{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.now b{font-weight:650}
.muted{color:var(--dim);font-size:12px}
form.cfg{display:grid;gap:9px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
  background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
label{display:block;font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
input[type=number],input[type=text]{width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);
  background:var(--bg);color:var(--text);font:inherit}
.chk{display:flex;align-items:center;gap:8px;margin-top:20px}
.chk input{width:18px;height:18px}
.full{grid-column:1/-1}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;background:var(--panel2);
  border:1px solid var(--line);padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;
  transition:opacity .25s;pointer-events:none;z-index:10}
#toast.show{opacity:1}
</style></head>
<body>
<header>
  <h1>Job Harness</h1>
  <span class="pill" id="state">…</span>
  <span class="pill" id="mode">…</span>
  <span class="pill" id="uptime">…</span>
  <span class="pill" id="updated" style="margin-left:auto">…</span>
</header>
<main>
  <section>
    <h2>Control</h2>
    <div class="controls">
      <button class="start" onclick="ctl('start')">START</button>
      <button class="pause" onclick="ctl('pause')">PAUSE</button>
      <button class="start" onclick="ctl('resume')">RESUME</button>
      <button class="stop" onclick="ctl('stop')">STOP</button>
    </div>
  </section>

  <section>
    <h2>Now</h2>
    <div class="now" id="now">…</div>
  </section>

  <section>
    <h2>Pipeline</h2>
    <div class="grid" id="pipeline"></div>
  </section>

  <section>
    <h2>Throughput &amp; Inference</h2>
    <div class="grid" id="rates"></div>
  </section>

  <section>
    <h2>Recent applications</h2>
    <div class="wrap"><table><thead><tr>
      <th>Company</th><th>Role</th><th>Score</th><th>Status</th><th>Detail</th><th>Updated</th>
    </tr></thead><tbody id="recent"></tbody></table></div>
  </section>

  <section>
    <h2>Blockers</h2>
    <div class="wrap"><table><thead><tr><th>Type</th><th>Count</th></tr></thead>
      <tbody id="blockers"></tbody></table></div>
  </section>

  <section>
    <h2>Settings</h2>
    <form class="cfg" onsubmit="saveCfg(event)">
      <div><label for="max_applications">Max applications</label>
        <input type="number" id="max_applications" min="0" max="100000"></div>
      <div><label for="max_applications_per_hour">Max per hour</label>
        <input type="number" id="max_applications_per_hour" min="0" max="1000"></div>
      <div><label for="max_applications_per_company">Max per company</label>
        <input type="number" id="max_applications_per_company" min="0" max="100"></div>
      <div><label for="min_score">Minimum score</label>
        <input type="number" id="min_score" min="0" max="100"></div>
      <div><label for="freshness_days">Freshness (days)</label>
        <input type="number" id="freshness_days" min="0" max="365"></div>
      <div class="chk"><input type="checkbox" id="remote_only"><label for="remote_only" style="margin:0">Remote only</label></div>
      <div class="chk"><input type="checkbox" id="allow_senior_roles"><label for="allow_senior_roles" style="margin:0">Allow senior roles</label></div>
      <div class="full"><label for="target_roles">Target roles (comma separated)</label>
        <input type="text" id="target_roles"></div>
      <div class="full"><button type="submit">Save settings</button></div>
    </form>
  </section>

  <section>
    <h2>Recent errors</h2>
    <div class="wrap"><table><thead><tr><th>Stage</th><th>Kind</th><th>Message</th><th>When</th></tr></thead>
      <tbody id="errors"></tbody></table></div>
  </section>
</main>
<div id="toast"></div>

<script>
const qs = new URLSearchParams(location.search);
const TOKEN = qs.get('token') || '';
const headers = TOKEN ? {'X-Auth-Token': TOKEN, 'Content-Type':'application/json'}
                      : {'Content-Type':'application/json'};
let dirty = false;
document.querySelectorAll('form.cfg input').forEach(el => el.addEventListener('input', () => dirty = true));

function esc(s){ return String(s ?? '').replace(/[&<>"]/g, c => (
  {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

function card(n, k, cls){
  return `<div class="card ${cls||''}"><div class="n">${esc(n)}</div><div class="k">${esc(k)}</div></div>`;
}

function hms(s){
  s = Math.max(0, Math.round(s||0));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60);
  return h ? `${h}h ${m}m` : `${m}m ${s%60}s`;
}

async function refresh(){
  let d;
  try {
    const r = await fetch('/api/status', {headers});
    if (r.status === 401){ document.getElementById('state').textContent = 'UNAUTHORIZED'; return; }
    d = await r.json();
  } catch (e) { document.getElementById('updated').textContent = 'offline'; return; }

  const st = d.run.state || 'UNKNOWN';
  const stEl = document.getElementById('state');
  stEl.textContent = st; stEl.className = 'pill ' + st;
  document.getElementById('mode').textContent = d.run.mode || '—';
  document.getElementById('uptime').textContent = hms(d.run.elapsed_s);
  document.getElementById('updated').textContent = (d.generated_at || '').slice(11, 19) + ' UTC';

  const p = d.pipeline;
  document.getElementById('pipeline').innerHTML =
      card(p.discovered,'Discovered') + card(p.scored,'Scored') + card(p.queued,'Queued')
    + card(p.opened,'Opened') + card(p.ready_to_submit,'Ready','ok')
    + card(p.submitted,'Submitted') + card(p.verified,'Verified','ok')
    + card(p.blocked,'Blocked','warn') + card(p.failed,'Failed','bad')
    + card(p.duplicates,'Duplicates') + card(p.skipped,'Skipped');

  document.getElementById('rates').innerHTML =
      card(d.rates.applications_per_hour,'Apps / hour')
    + card(d.rates.average_fit_score,'Avg fit score')
    + card(d.qwen.requests,'Qwen requests')
    + card(d.qwen.cache_hits,'Cache hits')
    + card(d.qwen.tokens.toLocaleString(),'Qwen tokens')
    + card('$' + d.qwen.estimated_cost_usd.toFixed(4),'Est. cost')
    + card('$' + d.rates.cost_per_verified_application.toFixed(4),'Cost / verified')
    + card(d.qwen.failures,'LLM failures', d.qwen.failures ? 'warn' : '');

  document.getElementById('now').innerHTML =
      `<b>${esc(d.run.current_state || 'IDLE')}</b> — `
    + (d.run.current_company ? `${esc(d.run.current_company)} · ${esc(d.run.current_role||'')}`
                             : '<span class="muted">no job in progress</span>')
    + `<div class="muted" style="margin-top:6px">run ${esc(d.run.run_id||'—')}</div>`;

  document.getElementById('recent').innerHTML = (d.recent||[]).map(r => `<tr>
      <td>${esc(r.company)}</td><td>${esc(r.title)}</td><td>${r.score ?? '—'}</td>
      <td><span class="tag ${esc(r.status)}">${esc(r.status)}</span></td>
      <td class="muted">${esc(r.ats_application_id || r.blocker_type || '')}</td>
      <td class="muted">${esc((r.updated_at||'').slice(11,19))}</td></tr>`).join('')
      || '<tr><td colspan="6" class="muted">nothing yet</td></tr>';

  document.getElementById('blockers').innerHTML = (d.blockers||[]).map(b =>
      `<tr><td>${esc(b.blocker_type)}</td><td>${b.n}</td></tr>`).join('')
      || '<tr><td colspan="2" class="muted">none</td></tr>';

  document.getElementById('errors').innerHTML = (d.errors||[]).map(e =>
      `<tr><td>${esc(e.stage)}</td><td>${esc(e.kind)}</td>
       <td class="muted">${esc((e.message||'').slice(0,140))}</td>
       <td class="muted">${esc((e.created_at||'').slice(11,19))}</td></tr>`).join('')
      || '<tr><td colspan="4" class="muted">none</td></tr>';

  if (!dirty && d.config){
    for (const k of ['max_applications','max_applications_per_hour',
                     'max_applications_per_company','min_score','freshness_days']){
      const el = document.getElementById(k); if (el) el.value = d.config[k];
    }
    document.getElementById('remote_only').checked = !!d.config.remote_only;
    document.getElementById('allow_senior_roles').checked = !!d.config.allow_senior_roles;
    document.getElementById('target_roles').value = (d.config.target_roles||[]).join(', ');
  }
}

async function ctl(action){
  const r = await fetch('/api/control', {method:'POST', headers,
    body: JSON.stringify({action})});
  const d = await r.json();
  toast(d.ok ? `${action.toUpperCase()} → ${d.state}` : (d.error || 'failed'));
  refresh();
}

async function saveCfg(ev){
  ev.preventDefault();
  const body = {
    max_applications: +document.getElementById('max_applications').value,
    max_applications_per_hour: +document.getElementById('max_applications_per_hour').value,
    max_applications_per_company: +document.getElementById('max_applications_per_company').value,
    min_score: +document.getElementById('min_score').value,
    freshness_days: +document.getElementById('freshness_days').value,
    remote_only: document.getElementById('remote_only').checked,
    allow_senior_roles: document.getElementById('allow_senior_roles').checked,
    target_roles: document.getElementById('target_roles').value,
  };
  const r = await fetch('/api/config', {method:'POST', headers, body: JSON.stringify(body)});
  const d = await r.json();
  dirty = false;
  toast(d.ok ? 'settings saved' : (d.error || 'save failed'));
  refresh();
}

refresh();
setInterval(refresh, 5000);
</script>
</body></html>
