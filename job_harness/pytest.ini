[pytest]
testpaths = tests
addopts = -q --strict-markers
markers =
    browser: requires a real Chromium browser
    slow: end-to-end test that drives the full pipeline
# job_harness is intentionally a namespace package (no top-level __init__.py):
# this tree lives inside a host repository whose root is itself a package, and a
# regular package here would make pytest resolve test modules through that root.
