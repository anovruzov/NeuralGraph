<title>Mycelic Live Demo</title>
<style>
/* Mycelic live console.
   Layout: a one-screen presentation console. The stage draws the organisation as mycelium (enterprise at the top,
   agents as growing tips at the bottom, hyphae thickening into cords as they climb); the panel on the right tells
   the act; an instrument strip under the stage counts what really happened. Below 960px it stacks.
   One deliberate dark look for projectors: loam ground, bone hyphae, spore-gold for the SD-9 signal, foxfire for
   rule conclusions. Gold and foxfire are reserved for data; the chrome (buttons, stepper, eyebrow) is bone.
   Semantic ok / warn / withdrawn colours are kept apart from both, and warn also has a shape (hollow dot). */
:root {
  color-scheme: dark;
  --loam: #100c09;      /* ground */
  --loam-1: #17120e;    /* panel wells */
  --loam-2: #221b15;    /* raised */
  --rule: #3a3027;      /* hairlines */
  --bone: #f0e7d8;      /* text, hyphae */
  --bone-2: #c3b7a4;
  --bone-3: #978b7a;
  --spore: #f3b646;     /* the signal */
  --spore-hi: #ffdc8f;
  --foxfire: #8ad9cf;   /* rule conclusions */
  --ok: #a9d18b;
  --warn: #c9a86a;
  --withdrawn: #e07a64;
  --f-display: "Fraunces", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --f-sans: "Hanken Grotesk", "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --gutter: clamp(16px, 1.4vw, 28px);
  --panel-w: clamp(360px, 30vw, 590px);
}
html, body { height: 100%; }
body { margin: 0; background: var(--loam); color: var(--bone); font: 400 15px/1.45 var(--f-sans);
  -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--bone); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- frame */
.app { height: 100%; min-height: 540px; display: grid; grid-template-rows: auto minmax(0, 1fr);
  padding-inline: var(--gutter); padding-block: 0 14px; overflow: hidden; }
.bar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 20px; padding-block: 12px 11px;
  border-bottom: 1px solid var(--rule); min-width: 0; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.brand svg { flex: none; }
.wordmark { font-family: var(--f-display); font-size: 27px; font-weight: 500; line-height: 1; letter-spacing: -0.01em;
  font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 60; }
.fiction { display: flex; flex-direction: column; font-size: 12.5px; line-height: 1.25; color: var(--bone-2); min-width: 0; }
.fiction b { font-weight: 600; color: var(--bone); }
.pill { display: inline-flex; align-items: center; gap: 9px; padding: 6px 12px 6px 10px; border: 1px solid var(--rule);
  border-radius: 999px; font-size: 12.5px; color: var(--bone-2); background: var(--loam-1); min-width: 0; }
.pill b { font: 600 11.5px/1 var(--f-mono); letter-spacing: 0.12em; color: var(--bone); }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bone-3); flex: none; }
.pill.live .dot { background: var(--ok); box-shadow: 0 0 0 0 rgba(169, 209, 139, 0.6); animation: beat 1.6s infinite; }
.pill.live b { color: var(--ok); }
.pill.reconnecting .dot { background: transparent; border: 1.5px solid var(--warn); }
.pill.reconnecting b { color: var(--warn); }
.pill.down .dot { background: var(--withdrawn); }
.pill.replay .dot { background: transparent; border: 1.5px solid var(--bone-2); }
.pill span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@keyframes beat { 70% { box-shadow: 0 0 0 7px rgba(169, 209, 139, 0); } 100% { box-shadow: 0 0 0 0 rgba(169, 209, 139, 0); } }
.checkcount { font: 500 12.5px var(--f-mono); color: var(--bone-2); white-space: nowrap; }
.checkcount b { color: var(--ok); font-weight: 500; }
.spacer { flex: 1 1 0; }
.stepper { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 4px; margin-bottom: 16px; max-width: 420px; }
.stepper::before { content: ""; position: absolute; left: 12px; right: 12px; top: 50%; height: 1px; background: var(--rule); }
.step { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--rule);
  background: var(--loam); color: var(--bone-3); font: 500 11.5px/1 var(--f-mono); cursor: pointer; padding: 0; }
.step:disabled { cursor: default; }
.step.done { color: var(--bone-2); border-color: #6b5a47; }
.step.current { background: var(--bone); border-color: var(--bone); color: var(--loam); font-weight: 600; }
.step.current.running { animation: ring 1.4s ease-out infinite; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(240, 231, 216, 0.5); } 100% { box-shadow: 0 0 0 9px rgba(240, 231, 216, 0); } }
.controls { display: flex; align-items: center; gap: 6px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; height: 32px; min-width: 32px;
  padding: 0 10px; border: 1px solid var(--rule); border-radius: 6px; background: var(--loam-1); color: var(--bone-2);
  font: 500 12.5px/1 var(--f-sans); cursor: pointer; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: #6b5a47; color: var(--bone); }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn[aria-pressed="true"] { color: var(--bone); border-color: var(--bone-3); background: var(--loam-2); }
.btn.primary { background: var(--bone); border-color: var(--bone); color: var(--loam); font-weight: 600; padding: 0 14px; }
.btn.primary:hover:not(:disabled) { background: #fffaf0; color: var(--loam); }
.btn.primary.busy { background: var(--loam-1); color: var(--bone); border-color: var(--bone-3); }
.btn svg { width: 14px; height: 14px; }
.btn .kbd { font: 500 10.5px var(--f-mono); color: var(--bone-3); }

.main { position: relative; display: grid; min-height: 0; grid-template-columns: minmax(0, 1fr) var(--panel-w);
  grid-template-rows: minmax(0, 1fr) auto; grid-template-areas: "stage panel" "strip panel"; column-gap: var(--gutter);
  padding-top: 12px; }

/* ---------------------------------------------------------------- stage */
.stage { grid-area: stage; position: relative; min-height: 0; min-width: 0; overflow: hidden; border-radius: 3px;
  background: var(--loam); isolation: isolate; }
.stage canvas, .stage svg.net { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.stage canvas { pointer-events: none; }
.stage svg.net { overflow: visible; }
.stage .overlay { position: absolute; inset: 0; pointer-events: none; }
.stage .overlay > * { pointer-events: auto; }
.stage.flash::after { content: ""; position: absolute; inset: 0; background: var(--withdrawn); opacity: 0;
  animation: flash 0.9s ease-out; pointer-events: none; z-index: 5; }
@keyframes flash { 0% { opacity: 0.28; } 100% { opacity: 0; } }
.stage > canvas, .stage > svg.net { transition: opacity 0.8s; }
.stage.ended > canvas, .stage.ended > svg.net { opacity: 0.6; }
.stage.ended .legend { display: none; }
.stage.ended .overlay { opacity: 0.6; transition: opacity 0.8s; }

.net .strand { fill: none; stroke: var(--bone); stroke-linecap: round; }
.net .knot { fill: var(--loam); stroke: var(--bone-3); }
.net .knot.lit { stroke: var(--bone); }
.net .knot.signal { stroke: var(--spore-hi); }
.net .tip { fill: var(--bone-3); }
.net .tip.core { fill: var(--spore-hi); }
.net .tip.bg { fill: var(--bone-2); }
.net .hit { fill: transparent; cursor: pointer; }
.net .seed { fill: #3a3027; stroke: var(--bone-2); stroke-width: 0.9; }
.net text { font-family: var(--f-sans); fill: var(--bone-3); paint-order: stroke; stroke: var(--loam); stroke-width: 3.5px;
  stroke-linejoin: round; }
.net text { transition: opacity 0.4s; }
.stage.bannered .net text { opacity: 0.12; }
.net .t-layer { font: 500 9.5px var(--f-mono); letter-spacing: 0.14em; fill: #7d7263; stroke-width: 0; }
@media (min-width: 1280px) { .net .t-layer { font-size: 11.5px; fill: var(--bone-3); } }
.net .stratum { stroke: var(--bone); stroke-opacity: 0.045; stroke-dasharray: 1 5; }
.net .t-ent { font-family: var(--f-display); font-size: 18px; fill: var(--bone); font-variation-settings: "SOFT" 100, "opsz" 36; }
.stage.narrow .net .t-ent { font-size: 14px; }
.stage.narrow .net .t-region { font-size: 12.5px; }
.net .t-region { font-family: var(--f-display); font-size: 17px; fill: var(--bone); font-variation-settings: "SOFT" 100, "opsz" 36; }
.net .t-sub { font-size: 10.5px; fill: #8a7f70; }
.net .t-dept { font-size: 11px; fill: var(--bone-3); }
.net .t-team { font-size: 12px; fill: var(--bone-2); }
.net .bloom { cursor: pointer; outline: none; }
.net .bloom .gill { stroke: var(--foxfire); stroke-width: 1; stroke-linecap: round; }
.net .bloom .cap { fill: var(--loam); stroke: var(--foxfire); stroke-width: 1.4; }
.net .bloom .ring { fill: none; stroke: var(--foxfire); stroke-opacity: 0.45; }
.net .bloom .halo-stop { stop-color: var(--foxfire); }
.net .bloom .xmark { stroke: var(--withdrawn); stroke-width: 1.6; stroke-linecap: round; display: none; }
.net .bloom.withdrawn .gill { display: none; }
.net .bloom.withdrawn .cap { stroke: var(--withdrawn); }
.net .bloom.withdrawn .xmark { display: inline; }
.net .bloom.withdrawn .ring { stroke: var(--withdrawn); stroke-opacity: 0.9; stroke-width: 1.4; stroke-dasharray: 4 4; }
.net .bloom .focus { fill: none; stroke: var(--spore-hi); stroke-width: 1.5; opacity: 0; }
.net .bloom:focus-visible .focus { opacity: 1; }
.net .bloom .hatch { fill: url(#hatch); stroke: var(--bone-2); stroke-width: 1; stroke-dasharray: 3 3; }
.net .lin { fill: none; stroke: var(--spore-hi); stroke-width: 2; stroke-linecap: round; stroke-opacity: 0.45; }
.net .flowing .lin { stroke-width: 2.2; stroke-dasharray: 7 6; stroke-opacity: 1; animation: flow 1.2s linear infinite; }
.net .lin.redacted { stroke: var(--bone-2); stroke-width: 1.6; stroke-dasharray: 2 5; stroke-opacity: 0.8; }
.net .lin-root { fill: none; stroke: var(--spore-hi); stroke-width: 1.5; }
.net .lin-root.redacted { fill: url(#hatch); stroke: var(--bone-2); stroke-dasharray: 2 2; }
@keyframes flow { to { stroke-dashoffset: -26; } }

.stamp { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3; pointer-events: none;
  padding: 6px 12px; border: 1px solid rgba(169, 209, 139, 0.45); border-radius: 4px; background: rgba(16, 12, 9, 0.92);
  font: 500 13px/1.2 var(--f-mono); color: var(--ok); white-space: nowrap; animation: rise 0.5s ease-out; }
.stamp:empty { display: none; }
.stage.narrow .stamp { max-width: calc(100% - 16px); white-space: normal; text-align: center; font-size: 12px; bottom: 6px;
  text-wrap: balance; }
@media (max-height: 820px) { .stage.stamped .net .t-team { opacity: 0.1; } }
.banner { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center;
  pointer-events: none; transition: opacity 0.5s; width: min(96%, 820px); z-index: 3; padding: 48px 72px;
  background: radial-gradient(closest-side, rgba(16, 12, 9, 0.97), rgba(16, 12, 9, 0.93) 62%, rgba(16, 12, 9, 0)); }
.banner:empty { display: none; }
.banner .b-state { font: 500 12px/1 var(--f-mono); letter-spacing: 0.18em; text-transform: uppercase; color: var(--bone-2); }
.banner .b-main { font-family: var(--f-display); font-size: clamp(26px, 3.2vw, 52px); line-height: 1.05; margin-top: 10px;
  font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 96; text-wrap: balance; text-shadow: 0 0 24px var(--loam), 0 0 8px var(--loam); }
.banner .b-sub { font-size: 14px; color: var(--bone-2); margin-top: 10px; text-shadow: 0 0 10px var(--loam); }
.banner.killed .b-main, .banner.killed .b-state { color: var(--withdrawn); }
.banner.ok .b-state { color: var(--ok); }
.stage.narrow .banner { top: 66%; padding: 26px 18px; }
.stage.narrow .banner .b-main { font-size: 26px; }
.stage.narrow .banner .b-sub { font-size: 13px; }

.bcard { position: absolute; width: max-content; max-width: 250px; padding: 8px 11px 9px; background: rgba(23, 18, 14, 0.9);
  border: 1px solid rgba(138, 217, 207, 0.45); border-radius: 4px; pointer-events: auto; cursor: pointer;
  transition: opacity 0.5s, transform 0.5s; backdrop-filter: blur(2px); z-index: 2; }
.bcard .k { font: 500 10px/1.2 var(--f-mono); letter-spacing: 0.06em; color: var(--foxfire); }
.bcard .t { font-family: var(--f-display); font-size: 17px; line-height: 1.12; margin-top: 3px; color: var(--bone);
  font-variation-settings: "SOFT" 100, "opsz" 30; }
.bcard .m { font: 11.5px/1.3 var(--f-mono); color: var(--bone-2); margin-top: 4px; font-variant-numeric: tabular-nums; }
.bcard.ent { max-width: 360px; border-color: rgba(138, 217, 207, 0.7); box-shadow: 0 0 36px rgba(138, 217, 207, 0.14); }
.bcard.ent .t { font-size: 22px; }
@media (min-width: 1280px) { .bcard.ent .t { font-size: 28px; } }
.bcard .hist { font: 10.5px/1.3 var(--f-mono); color: var(--withdrawn); margin-top: 4px; }
.bcard.withdrawn { border-color: rgba(224, 122, 100, 0.6); }
.bcard.withdrawn .k, .bcard.withdrawn .m { color: var(--withdrawn); }
.bcard.withdrawn .t { text-decoration: line-through; text-decoration-color: var(--withdrawn); color: var(--bone-2); }
.bcard.redacted { border-style: dashed; border-color: var(--bone-3);
  background: repeating-linear-gradient(135deg, rgba(23, 18, 14, 0.94) 0 6px, rgba(60, 50, 40, 0.94) 6px 7px); }
.bcard.redacted .k { color: var(--bone-2); }
.bcard.redacted .t { color: var(--bone-2); }
.bcard.sel { border-color: var(--spore-hi); }
.stage.narrow .bcard { max-width: 172px; padding: 5px 8px 6px; }
.stage.narrow.bannered .bcard { opacity: 0; }
.stage.narrow .bcard .k { font-size: 9px; }
.stage.narrow .bcard .t, .stage.narrow .bcard.ent .t { font-size: 14px; }
.stage.narrow .bcard .m { font-size: 10px; margin-top: 2px; }

.tooltip { position: absolute; z-index: 6; pointer-events: none; max-width: 280px; padding: 7px 10px; font-size: 12.5px;
  line-height: 1.35; background: var(--loam-2); border: 1px solid var(--rule); border-radius: 4px; color: var(--bone-2); }
.tooltip b { color: var(--bone); font-family: var(--f-mono); font-weight: 500; }
.selcard { position: absolute; left: 12px; top: 34px; z-index: 4; width: min(400px, calc(100% - 24px)); padding: 12px 14px;
  background: rgba(23, 18, 14, 0.94); border: 1px solid var(--bone-3); border-radius: 4px; font-size: 13px; color: var(--bone-2); }
.selcard .x { position: absolute; right: 6px; top: 6px; height: 26px; min-width: 26px; padding: 0; }
.selcard h3 { margin: 0 30px 4px 0; font: 400 19px/1.15 var(--f-display); color: var(--bone); font-variation-settings: "SOFT" 100; }
.selcard .mono { font-size: 12px; }
.legend { position: absolute; left: 10px; top: 8px; display: flex; gap: 6px 14px; font-size: 11.5px; color: var(--bone-3);
  pointer-events: none; z-index: 1; white-space: nowrap; }
.stage.narrow .legend { display: none; }
.legend span { display: inline-flex; align-items: center; gap: 6px; pointer-events: auto; cursor: help; }
.legend i { display: inline-block; }
.lg-signal { width: 16px; height: 2px; background: var(--spore); box-shadow: 0 0 6px var(--spore); }
.lg-bg { width: 16px; height: 1px; background: var(--bone-2); opacity: 0.6; }
.lg-seed { width: 7px; height: 7px; border: 1px solid var(--bone-2); background: #3a3027; transform: rotate(45deg) scaleY(1.2); }
.lg-bloom { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--foxfire); box-shadow: 0 0 6px var(--foxfire); }

/* close: the end card (in the panel) */
.endcard { display: grid; gap: 18px; min-width: 0; }
.endcard .strat { border: 1px solid rgba(138, 217, 207, 0.55); border-radius: 4px; padding: 14px 16px;
  background: linear-gradient(180deg, rgba(138, 217, 207, 0.08), rgba(138, 217, 207, 0.02)); }
.endcard .strat .k { font: 500 11px var(--f-mono); letter-spacing: 0.06em; color: var(--foxfire); }
.endcard .strat .head { font: 400 clamp(26px, 2.3vw, 40px)/1.05 var(--f-display); margin-top: 6px; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 72; }
.endcard .strat .m { font: 13px/1.35 var(--f-mono); color: var(--bone-2); margin-top: 6px; }
.endcard .passed { font: 400 44px/1 var(--f-display); color: var(--ok); font-variation-settings: "SOFT" 100, "opsz" 96; }
.endcard .passed span { font-size: 0.5em; color: var(--bone-2); }
.endcard .totals { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 20px; }
.total b { display: block; font: 500 clamp(22px, 1.9vw, 34px)/1 var(--f-mono); color: var(--bone); font-variant-numeric: tabular-nums; }
.total span { display: block; margin-top: 5px; font-size: 13px; color: var(--bone-2); line-height: 1.3; }
.endcard .product { font: 400 clamp(20px, 1.6vw, 28px)/1.2 var(--f-display); color: var(--bone); font-variation-settings: "SOFT" 100, "opsz" 48; margin: 0; }
.endcard .allchecks { max-height: none; }
.endcard .checks li { font-size: 13px; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--bone-2); font: 500 12.5px var(--f-mono); cursor: pointer;
  text-decoration: underline; text-decoration-color: var(--bone-3); text-underline-offset: 3px; justify-self: start; }
.linkbtn:hover { color: var(--bone); }

/* ---------------------------------------------------------------- strip */
.strip { grid-area: strip; display: flex; flex-wrap: wrap; align-items: stretch; gap: 10px 26px; margin-top: 10px;
  padding-top: 10px; border-top: 1px solid var(--rule); min-width: 0; }
.counters { display: flex; gap: clamp(14px, 1.6vw, 28px); flex-wrap: wrap; }
.counter b { display: block; font: 500 clamp(18px, 1.45vw, 26px)/1 var(--f-mono); font-variant-numeric: tabular-nums; color: var(--bone); }
.counter span { display: block; margin-top: 5px; font-size: 10.5px; letter-spacing: 0.09em; text-transform: uppercase; color: var(--bone-3); white-space: nowrap; }
.counter.signal b { color: var(--spore-hi); }
.counter.svc b { font-size: clamp(14px, 1vw, 17px); padding-top: 3px; display: flex; align-items: center; gap: 7px; }
.counter.svc i { width: 8px; height: 8px; border-radius: 50%; background: var(--bone-3); }
.counter.svc.ok i { background: var(--ok); } .counter.svc.ok b { color: var(--ok); }
.counter.svc.down i { background: var(--withdrawn); } .counter.svc.down b { color: var(--withdrawn); }
.counter.svc.warn i { background: transparent; border: 1.5px solid var(--warn); } .counter.svc.warn b { color: var(--warn); }
.feed { flex: 1 1 320px; min-width: 0; margin: 0; padding: 0; list-style: none; font: 11.5px/1.55 var(--f-mono);
  color: var(--bone-3); font-variant-numeric: tabular-nums; }
.feed li { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.feed li:last-child { color: var(--bone-2); }
.feed .ty { display: inline-block; min-width: 7.2em; color: var(--bone-2); }
.feed .ty.gold { color: var(--spore); } .feed .ty.fox { color: var(--foxfire); } .feed .ty.ok { color: var(--ok); }
.feed .ty.bad { color: var(--withdrawn); } .feed .ty.warn { color: var(--warn); text-decoration: underline dashed; text-underline-offset: 3px; }

/* ---------------------------------------------------------------- panel */
.panel { container-type: inline-size; grid-area: panel; min-height: 0; min-width: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
  gap: clamp(14px, 1.6vh, 22px); padding-block: 6px 4px; scrollbar-width: thin; scrollbar-color: var(--rule) transparent; }
.eyebrow { display: flex; gap: 12px; align-items: baseline; font: 500 12px/1 var(--f-mono); letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--bone-2); }
.eyebrow .dim { color: var(--bone-3); letter-spacing: 0.04em; text-transform: none; }
.act-title { margin: 10px 0 0; font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 2.55vw, 50px);
  line-height: 1.04; letter-spacing: -0.012em; text-wrap: balance; font-variation-settings: "SOFT" 100, "WONK" 0, "opsz" 110; }
.caption { margin: 10px 0 0; font-size: clamp(16px, 1.12vw, 21px); line-height: 1.4; color: var(--bone-2); text-wrap: pretty; }
.artefact { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sec { font: 500 10.5px/1 var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--bone-3);
  display: flex; align-items: center; gap: 10px; }
.sec::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
.row { display: flex; gap: 10px; align-items: baseline; min-width: 0; }
.muted { color: var(--bone-3); }
.small { font-size: 13px; }
.quote { font-family: var(--f-display); font-size: clamp(16px, 1.15vw, 20px); line-height: 1.3; color: var(--bone);
  font-variation-settings: "SOFT" 100, "opsz" 24; margin: 0; }
.quote.gold { color: var(--spore-hi); }
.who { font: 12px/1.4 var(--f-mono); color: var(--bone-3); margin-top: 6px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.who b { color: var(--bone-2); font-weight: 500; }

  function layout() {

      n.jit2 = (j() - 0.5);

  // ============================================================ background texture
  function drawBackground() {

        const y0 = ORG.rows[LAYERS[i]], y1 = ORG.rows[LAYERS[i + 1]];

      c.beginPath(); c.moveTo(x, y);

  // ============================================================ per-frame drawing

  function sprite(rgb) {

  function sporePos(sp, u) {

    const a = sp.nodes[i], b = sp.nodes[i + 1];

  function drawFx(dt) {

    c.globalCompositeOperation = "lighter";
    const p = V.reveal;
    // gold threads: the SD-9 signal that has actually travelled up the hyphae
    for (const e of EDGES) {
      const g = V.goldD.get(e.child.path) || 0;
      if (g < 0.01) continue;
      const rv = revealFor(e.child.layer, p);
      if (rv < 0.01) continue;
      let k = (1 - Math.exp(-g / 3.2)) * rv * climaxDim(e.child.path);
      if (ui.linEdges) k *= ui.linEdges.has(e.child.path) ? 1.25 : 0.12;

    }

    for (const n of ORG.nodes.values()) {
      if (n.kind !== "unit") continue;
      const a = n._act;
      if (!a || !a.n) continue;
      const bl = EL.blooms.get(n.path);
      if (bl && bl.state === "withdrawn") continue;             // a withdrawn conclusion is a hollow ring, not a sun
      const rv = revealFor(n.layer, p);

    for (const sp of V.spores) {
      const u = (clock.now - sp.t0) / sp.dur;
      if (u >= 1) { while (sp.bumped < sp.nodes.length - 1) bump(sp.nodes[sp.bumped++].path, sp.signal, sp.signal ? 1 : 0.5); continue; }
      keep.push(sp);

  function updateSvg() {
    const p = V.reveal;
    for (const e of EDGES) {
      const b = V.boneD.get(e.child.path) || 0;
      const born = e.child.kind !== "agent" || (S.agents.get(e.child.agent.agent_id) || {}).registered;
      const rv = revealFor(e.child.layer, p);
      let op = born ? 0.2 + (0.1 + Math.min(0.45, 0.14 * b)) * rv : 0.07;
      if (ui.linEdges && !ui.linEdges.has(e.child.path)) op *= 0.5;
      op *= climaxDim(e.child.path);
      const r = Math.round(op * 100) / 100;
      if (r !== e.op) { e.g.setAttribute("opacity", r); e.op = r; }
    }
    for (const [id, t] of EL.tips) {
      const a = S.agents.get(id);
      const reg = a && a.registered;
      let s = 1;
      const born = V.born.get(id);
      if (reg && born != null && !reduced()) { const u = (clock.now - born) / 0.6; if (u < 1) s = u < 0.55 ? mix(0.2, 1.7, u / 0.55) : mix(1.7, 1, (u - 0.55) / 0.45); }
      const key = reg ? "r" + s.toFixed(2) : "u";
      if (key !== t.last) {
        t.last = key;
        t.tip.setAttribute("r", reg ? (t.r * s).toFixed(2) : (t.r * 0.45).toFixed(2));

    const dwell = DWELL[id] != null ? DWELL[id] : 6;
    if (ui.auto && dwell > 0 && ui.act < TR.acts.length - 1 && clock.now - ui.finishedAt > dwell) jump(ui.act + 1);
  }

  // live: fetch what happened so far, then follow the event stream
  let liveEvents = [];
  const runKey = (tr) => { const m = (tr && tr.meta) || {}; return m.run_id || `${m.mode || ""}|${m.recorded_at || ""}`; };
  function adoptSnapshot(snap) {
    // a tab left open across a restart (or a replay started on the same port) must not mix two runs: start over
    if (TR && runKey(TR) !== runKey(snap)) { location.reload(); return; }
    const orgChanged = !TR || JSON.stringify((TR.org || {}).agents || []) !== JSON.stringify((snap.org || {}).agents || []) ||
      ((TR.org || {}).units || []).length !== ((snap.org || {}).units || []).length;
    TR = Object.assign({}, snap, { events: liveEvents });
    RULES = new Map((TR.rules || []).map((r) => [r.rule_id, r]));
    $("company").textContent = (TR.meta && TR.meta.company) || "Fictional company";
    legendTitle();
    if (orgChanged) {
      ORG = buildOrg(TR);
      if (ORG) { layout(); edgeMap = EDGE_BY_CHILD(); S = freshState(); resetVisual(); for (const e of liveEvents) apply(e, false); updateVisuals(1, true); }
    }
    ui.dirty = true;
    $("stepper").dataset.key = "";
  }
  function startLive() {
    ui.live.state = "connecting";
    fetch("trace", { cache: "no-store" }).then((r) => r.json()).then((tr) => {
      liveEvents = (tr.events || []).slice();
      adoptSnapshot(tr);
      ui.live.applied = liveEvents.length;
      if (liveEvents.some((e) => e.type === "done")) ui.live.state = "complete";
      connect();
    }).catch(() => { ui.live.state = "reconnecting"; ui.dirty = true; setTimeout(startLive, 1500); });
  }
  function connect() {
    const es = new EventSource("events");
    es.onopen = () => { if (ui.live.state !== "complete") ui.live.state = "open"; ui.dirty = true; };
    es.onerror = () => { if (ui.live.state !== "complete") { ui.live.state = "reconnecting"; ui.dirty = true; } };
    es.addEventListener("snapshot", (e) => { try { adoptSnapshot(JSON.parse(e.data)); } catch (err) { /* keep the last snapshot */ } });
    ui.live.es = es;
    es.onmessage = (e) => {
      const idx = parseInt(e.lastEventId, 10);
      if (!isNaN(idx) && idx < ui.live.applied) return;
      let ev; try { ev = JSON.parse(e.data); } catch (err) { return; }
      liveEvents.push(ev);
      ui.live.applied = isNaN(idx) ? ui.live.applied + 1 : idx + 1;
      if (ORG) queue.push({ ev, due: clock.now });
      if (ev.type === "done") { ui.live.state = "complete"; ui.dirty = true; }    // keep listening: a new run is detected
    };
  }

  // ============================================================ keyboard
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const tag = (e.target && e.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    const k = e.key;
    if (k === "ArrowRight" || k === " " || k === "PageDown") { e.preventDefault(); next(); }
    else if (k === "ArrowLeft" || k === "PageUp") { if (MODE === "replay") { e.preventDefault(); jump(ui.preview ? 0 : ui.act - 1); } }
    else if (k === "r" || k === "R") { if (MODE === "replay") jump(0); }
    else if (/^[0-9]$/.test(k)) { if (MODE === "replay") jump(Math.min(parseInt(k, 10), (TR.acts || []).length - 1)); }
    else if (k === "p" || k === "P") togglePause();
    else if (k === "a" || k === "A") { if (MODE === "replay") toggleAuto(); }
    else if (k === "s" || k === "S") { if (MODE === "replay") cycleSpeed(); }
    else if (k === "n" || k === "N") toggleNotes();
    else if (k === "c" || k === "C") toggleAllChecks();
    else if (k === "v" || k === "V") { if (latestLineageIn("receipts", (l) => l.viewer !== "admin")) { ui.viewAs = ui.viewAs === "admin" ? "agent" : "admin"; ui.viewTouched = true; ui.dirty = true; } }
    else if (k === "?") toggleHelp();
    else if (k === "Escape") { ui.sel = null; toggleHelp(false); toggleNotes(false); toggleAllChecks(false); ui.dirty = true; }
  });

  // ============================================================ main loop
  let lastTs = 0, lastPanel = 0;
  function frame(ts) {
    const dt = lastTs ? Math.min(0.1, (ts - lastTs) / 1000) : 0;
    lastTs = ts;
    if (!ui.paused) clock.now += dt * (MODE === "replay" ? ui.speed : 1);
    if (ORG && S) {
      pump();
      runTimers();
      replayTick();
      updateVisuals(ui.paused ? 0 : dt * (MODE === "replay" ? ui.speed : 1));
      drawFx(dt);
      updateSvg();
      V.snap = false;
      placeCards();
      if (ui.dirty && ts - lastPanel > 120) {
        ui.dirty = false; lastPanel = ts;
        const key = panelKey();
        if (key !== ui.lastPanelKey) {
          ui.lastPanelKey = key;
          const focused = document.activeElement && document.activeElement.id;
          renderPanel(); renderStrip();
          if (focused && document.activeElement !== $(focused) && $(focused)) $(focused).focus();
        }
        renderBar(); renderBanner(); renderSelCard(); renderNotes();
      }
    }
    requestAnimationFrame(frame);
  }
  function panelKey() {
    const visible = S.derived.filter((m) => shown(m)).length;
    return [S.v, visible, ui.viewAs, ui.sel, window.innerWidth > 960, window.innerHeight <= 820, ui.live.state, !!ui.preview, ui.allChecks].join(":");
  }
  // the panel also depends on the clock (conclusions become visible when their spores land)
  setInterval(() => { ui.dirty = true; }, 500);

  let resizeT = 0;
  const ro = new ResizeObserver(() => { clearTimeout(resizeT); resizeT = setTimeout(() => { if (ORG) { layout(); edgeMap = EDGE_BY_CHILD(); ui.dirty = true; } }, 60); });
  ro.observe(stage);

  function boot() {
    sporeSprite = sprite(COLORS.gold); sporeSpriteBone = sprite(COLORS.bone); sporeSpriteBad = sprite(COLORS.bad);
    S = freshState();
    stage.appendChild($("notes"));                          // notes dock inside the stage, clear of the counters
    $("app").classList.toggle("live", MODE === "live");
    if (PRESENTER) { $("app").classList.add("presenter"); toggleNotes(true); }
    if (BC) BC.onmessage = (e) => { if (MODE === "replay" && e.data && typeof e.data.act === "number" && e.data.act !== ui.act) jump(e.data.act, true); };
    if (MODE === "replay") {
      TR = JSON.parse(embedded.textContent);
      RULES = new Map((TR.rules || []).map((r) => [r.rule_id, r]));
      $("company").textContent = (TR.meta && TR.meta.company) || "Fictional company";
      legendTitle();
      ORG = buildOrg(TR);
      layout();
      edgeMap = EDGE_BY_CHILD();
      const hash = (location.hash || "").slice(1);
      if (hash === "manual" || hash === "stage" || PRESENTER) ui.auto = false;
      const m = /^act-?(\d)$/.exec(hash);
      if (m) jump(parseInt(m[1], 10));
      else if (!ui.auto || !preview()) jump(0);
    } else {
      startLive();
    }
    requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(boot, boot); else boot();
})();
</script>
