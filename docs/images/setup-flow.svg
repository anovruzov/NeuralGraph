<text x="611.9000000000001" y="135" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#8f8f8f" text-anchor="start">as you work</text>
