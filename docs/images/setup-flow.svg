<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 190" width="800" height="190" role="img" aria-labelledby="t d">
<title id="t">Setup flow</title>
<desc id="d">Four steps: install with one command, configure a local model with the setup wizard, connect your agent, and start remembering.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#bdbdbd" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M1 1.5 L8.5 5 L1 8.5" fill="none" stroke="#5c5c5c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#1c1c1c"/>
  </pattern>
</defs>
<rect x="0.5" y="0.5" width="799" height="189" rx="14" fill="#0a0a0a" stroke="#2a2a2a"/>
<rect x="1" y="1" width="798" height="188" rx="14" fill="url(#dots)"/>
<rect x="40.0" y="34" width="164" height="122" rx="12" fill="#121212" stroke="#2a2a2a" stroke-width="1"/>
