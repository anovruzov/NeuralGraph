<text x="241.3" y="62" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#5c5c5c" text-anchor="start">02</text>
<text x="241.3" y="92" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Configure</text>
<text x="241.3" y="117" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#8f8f8f" text-anchor="start">the wizard finds or</text>
<text x="241.3" y="135" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#8f8f8f" text-anchor="start">installs a local model</text>
<line x1="392.3" y1="95" x2="407.6" y2="95" stroke="#bdbdbd" stroke-width="1.5" marker-end="url(#arr)"/>
<rect x="410.6" y="34" width="164" height="122" rx="12" fill="#121212" stroke="#2a2a2a" stroke-width="1"/>
<text x="426.6" y="62" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5" font-weight="400" fill="#5c5c5c" text-anchor="start">03</text>
<text x="426.6" y="92" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="start">Connect</text>
<text x="426.6" y="117" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.8" font-weight="400" fill="#8f8f8f" text-anchor="start">Claude Code, Codex,</text>
