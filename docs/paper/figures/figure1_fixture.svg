<text x="30.0" y="376.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal">Replica count sees three holders of the right premise and reports redundancy 3.</text>
<text x="30.0" y="394.0" font-size="11.5" fill="#1a1a1a" text-anchor="start" font-weight="normal">Failing R2 removes B and C together. Only D survives, so the minimum failure-domain cut is 2, not 3.</text>
<text x="30.0" y="412.0" font-size="10" fill="#767676" text-anchor="start" font-weight="normal">Source: NeuralGraph/coordination/fixture.py — record table read directly, not redrawn.</text>
