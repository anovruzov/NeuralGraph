<text x="30.0" y="56.0" font-size="11.5" fill="#767676" text-anchor="start" font-weight="normal">The capability needs one left premise and one right premise. B, C and D all hold the right premise.</text>
<text x="30.0" y="73.0" font-size="11.5" fill="#767676" text-anchor="start" font-weight="normal">C copies B's lineage root (R2) and failure domain (FD2). Only D is independently rooted.</text>
