[package]
name = "neuralgraph-research"
version = "1.0.0"
description = "NeuralGraph research track: the Tesseract retrieval engine, the coordination simulator and the benchmark harnesses"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "neuralgraph_research"
path = "src/lib.rs"

[dependencies]
# The research crate builds on the product crate (pycompat, temporal, backend, bm25, the memory library the
# chat_memory harnesses drive). The reverse dependency is forbidden: see tests/crate_boundary.rs.
neuralgraph-memory = { path = "../neuralgraph-memory" }
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
fancy-regex = "0.19.2"
futures = "0.3.34"
indexmap = { version = "2.14.2", features = ["serde"] }
parking_lot = "0.12"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.54.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27.0"
