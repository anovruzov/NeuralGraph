[package]
name = "neuralgraph-memory"
version = "1.0.0"
description = "NeuralGraph cross-chat memory: SQLite store, background extraction worker, hybrid retrieval, MCP + REST + dashboard"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "neuralgraph_memory"
path = "src/lib.rs"

[[bin]]
name = "neuralgraph-memory"
path = "src/main.rs"

[[example]]
name = "chat_memory_demo"
path = "../../demo/chat_memory_demo.rs"

[[example]]
name = "chat_memory_live_demo"
path = "../../demo/chat_memory_live_demo.rs"

[dependencies]
async-trait = "0.1.92"
axum = "0.8.9"
blake2 = "0.11.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive", "env"] }
fancy-regex = "0.19.2"
futures = "0.3.34"
indexmap = "2.14.2"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1.54.0", features = ["full"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
unicode-normalization = "0.1.26"
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tower = "0.5.3"
